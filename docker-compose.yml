version: '3.8'

services:
  campusintel-rag:
    build: .
    container_name: campusintel_cloud_app
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - VECTOR_DB_PROVIDER=chroma_local
      - ENABLE_SEMANTIC_CACHE=true
      - REDIS_URL=redis://redis-cache:6379/0
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./cache:/app/cache
    depends_on:
      - redis-cache
    restart: unless-stopped

  redis-cache:
    image: redis:7.2-alpine
    container_name: campusintel_redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant-vector-db:
    image: qdrant/qdrant:latest
    container_name: campusintel_qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_storage:
